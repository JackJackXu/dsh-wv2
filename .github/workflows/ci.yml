name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build src/DeepSeekHarness.Desktop/DeepSeekHarness.Desktop.csproj -c Release
      - name: Publish single-file
        run: dotnet publish src/DeepSeekHarness.Desktop/DeepSeekHarness.Desktop.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o release
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-wv2-windows
          path: release/DSH WV2.exe
          if-no-files-found: error
